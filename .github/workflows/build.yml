name: Build Android APK

# Kada se pokreće: na svaki push na main granu, i ručno iz GitHub-a.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Napravi Android APK
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

    steps:
      # 1. Preuzmi kod iz repozitorija
      - name: Preuzmi kod
        uses: actions/checkout@v4

      # 2. Instaliraj Javu (potrebna za Android build)
      - name: Postavi Javu
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Instaliraj Flutter (stabilna verzija)
      - name: Postavi Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'
          cache: true

      # 4. Generiši platformske foldere (android/) ako ne postoje.
      #    Ovo pravi potrebnu Android strukturu u oblaku, pa je
      #    ne moramo držati u repozitoriju.
      - name: Generiši Android projekat
        run: flutter create --platforms=android --project-name rezije .

      # 4b. Postavi compileSdk/targetSdk 36 (sqflite zahtijeva 36).
      - name: Podesi Android SDK verzije
        run: |
          APP=android/app/build.gradle.kts
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' "$APP"
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 36/' "$APP"
          echo "----- app build.gradle.kts -----"
          grep -E 'compileSdk|targetSdk|minSdk' "$APP"

      # 4c. Konfiguriši potpisivanje fiksnim keystore-om iz GitHub Secrets.
      #     Daje STABILAN SHA-1 (potreban za Google/Gmail OAuth).
      #     Ako secret KEYSTORE_BASE64 ne postoji, preskače (debug potpis).
      - name: Konfiguriši potpisni ključ
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          # Dekodiraj keystore u android/app/
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/rezije-release.jks

          # Napiši key.properties
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=rezije-release.jks
          EOF

          # Ubaci signing config u app/build.gradle.kts (Kotlin DSL).
          APP=android/app/build.gradle.kts
          python3 - "$APP" <<'PY'
          import sys, re
          p = sys.argv[1]
          s = open(p, encoding='utf-8').read()

          # Učitaj key.properties na vrh (poslije plugins bloka).
          loader = '''
          import java.util.Properties
          import java.io.FileInputStream
          val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))
          }
          '''
          # Ubaci loader prije "android {"
          s = s.replace("android {", loader + "\nandroid {", 1)

          # Dodaj signingConfigs i veži na release unutar android { }.
          signing = '''
              signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                      storeFile = file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["storePassword"] as String
                  }
              }
          '''
          # Ubaci signingConfigs odmah poslije prve "android {".
          s = s.replace("android {", "android {\n" + signing, 1)

          # Postavi release buildType da koristi release potpis.
          s = re.sub(r'signingConfig\s*=\s*signingConfigs\.getByName\("debug"\)',
                     'signingConfig = signingConfigs.getByName("release")', s)

          open(p, 'w', encoding='utf-8').write(s)
          print("Signing config ubačen.")
          PY

          echo "----- app build.gradle.kts (signing) -----"
          grep -n 'signingConfig' "$APP" || true

      # 5. Preuzmi pakete (dependencies)
      - name: Preuzmi pakete
        run: flutter pub get

      # 6. Provjeri kod (ne prekida build ako ima samo upozorenja)
      - name: Analiziraj kod
        run: flutter analyze || true

      # 7. Napravi release APK
      - name: Napravi APK
        run: flutter build apk --release

      # 8. Okači APK kao artefakt da ga možeš skinuti sa GitHub-a
      - name: Okači APK
        uses: actions/upload-artifact@v4
        with:
          name: rezije-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
