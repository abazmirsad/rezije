name: Build Android APK

# Kada se pokreće: na svaki push na main granu, i ručno iz GitHub-a.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Napravi Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Preuzmi kod iz repozitorija
      - name: Preuzmi kod
        uses: actions/checkout@v4

      # 2. Instaliraj Javu (potrebna za Android build)
      - name: Postavi Javu
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Instaliraj Flutter (stabilna verzija)
      - name: Postavi Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'
          cache: true

      # 4. Generiši platformske foldere (android/) ako ne postoje.
      #    Ovo pravi potrebnu Android strukturu u oblaku, pa je
      #    ne moramo držati u repozitoriju.
      - name: Generiši Android projekat
        run: flutter create --platforms=android --project-name rezije .

      # 4b. Postavi Android SDK verzije.
      #     - U app modulu zamijeni Flutter placeholdere.
      #     - Dodaj skriptu (apply from) koja SVIM pluginima nametne
      #       compileSdk 36 / minSdk 23 (file_picker, sqflite... znaju
      #       ciljati stariji compileSdk pa build pukne).
      - name: Podesi Android SDK verzije
        run: |
          APP=android/app/build.gradle.kts
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' "$APP"
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' "$APP"
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 36/' "$APP"

          # Groovy skripta za override svih podprojekata (plugina).
          # Pišemo je redom (bez heredoc-a) da izbjegnemo probleme s
          # indentacijom YAML bloka.
          SO=android/sdk_override.gradle
          : > "$SO"
          echo 'subprojects {'                                      >> "$SO"
          echo '    afterEvaluate { proj ->'                        >> "$SO"
          echo "        if (proj.hasProperty('android')) {"         >> "$SO"
          echo '            proj.android {'                         >> "$SO"
          echo '                compileSdkVersion 36'               >> "$SO"
          echo '                if (defaultConfig.minSdkVersion == null || defaultConfig.minSdkVersion.apiLevel < 23) {' >> "$SO"
          echo '                    defaultConfig.minSdkVersion 23'  >> "$SO"
          echo '                }'                                  >> "$SO"
          echo '            }'                                      >> "$SO"
          echo '        }'                                          >> "$SO"
          echo '    }'                                              >> "$SO"
          echo '}'                                                  >> "$SO"

          # Poveži skriptu iz root build.gradle.kts.
          printf '\napply(from = "sdk_override.gradle")\n' >> android/build.gradle.kts

          echo "----- sdk_override.gradle -----"
          cat "$SO"
          echo "----- kraj root build.gradle.kts -----"
          tail -n 5 android/build.gradle.kts

      # 5. Preuzmi pakete (dependencies)
      - name: Preuzmi pakete
        run: flutter pub get

      # 6. Provjeri kod (ne prekida build ako ima samo upozorenja)
      - name: Analiziraj kod
        run: flutter analyze || true

      # 7. Napravi release APK
      - name: Napravi APK
        run: flutter build apk --release

      # 8. Okači APK kao artefakt da ga možeš skinuti sa GitHub-a
      - name: Okači APK
        uses: actions/upload-artifact@v4
        with:
          name: rezije-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
