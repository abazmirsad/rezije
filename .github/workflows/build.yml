name: Build Android APK

# Kada se pokreće: na svaki push na main granu, i ručno iz GitHub-a.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Napravi Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Preuzmi kod iz repozitorija
      - name: Preuzmi kod
        uses: actions/checkout@v4

      # 2. Instaliraj Javu (potrebna za Android build)
      - name: Postavi Javu
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Instaliraj Flutter (stabilna verzija)
      - name: Postavi Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'
          cache: true

      # 4. Generiši platformske foldere (android/) ako ne postoje.
      #    Ovo pravi potrebnu Android strukturu u oblaku, pa je
      #    ne moramo držati u repozitoriju.
      - name: Generiši Android projekat
        run: flutter create --platforms=android --project-name rezije .

      # 4b. Postavi Android SDK verzije.
      #     - U app modulu zamijeni Flutter placeholdere.
      #     - Dodaj skriptu (apply from) koja SVIM pluginima nametne
      #       compileSdk 36 / minSdk 23 (file_picker, sqflite... znaju
      #       ciljati stariji compileSdk pa build pukne).
      - name: Podesi Android SDK verzije
        run: |
          APP=android/app/build.gradle.kts
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' "$APP"
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' "$APP"
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 36/' "$APP"

          # Override za sve podprojekte (plugine) - pišemo Kotlin DSL
          # direktno u root build.gradle.kts preko refleksije (bez AGP
          # tipova u classpath-u). Ovo hvata file_picker, sqflite itd.
          # Override za sve podprojekte (plugine): kad se primijeni
          # Android plugin, postavi compileSdk 36 preko refleksije.
          # Koristimo plugins.withId (umjesto afterEvaluate) da izbjegnemo
          # "project is already evaluated" grešku.
          ROOT=android/build.gradle.kts
          {
            echo ''
            echo 'subprojects {'
            echo '    plugins.withId("com.android.library") {'
            echo '        val androidExt = extensions.findByName("android")'
            echo '        val m = androidExt?.javaClass?.methods?.firstOrNull {'
            echo '            it.name == "compileSdkVersion" && it.parameterTypes.size == 1 && it.parameterTypes[0] == Integer.TYPE'
            echo '        }'
            echo '        m?.invoke(androidExt, 36)'
            echo '    }'
            echo '    plugins.withId("com.android.application") {'
            echo '        val androidExt = extensions.findByName("android")'
            echo '        val m = androidExt?.javaClass?.methods?.firstOrNull {'
            echo '            it.name == "compileSdkVersion" && it.parameterTypes.size == 1 && it.parameterTypes[0] == Integer.TYPE'
            echo '        }'
            echo '        m?.invoke(androidExt, 36)'
            echo '    }'
            echo '}'
          } >> "$ROOT"

          echo "----- kraj root build.gradle.kts -----"
          tail -n 22 "$ROOT"

      # 5. Preuzmi pakete (dependencies)
      - name: Preuzmi pakete
        run: flutter pub get

      # 6. Provjeri kod (ne prekida build ako ima samo upozorenja)
      - name: Analiziraj kod
        run: flutter analyze || true

      # 7. Napravi release APK
      - name: Napravi APK
        run: flutter build apk --release

      # 8. Okači APK kao artefakt da ga možeš skinuti sa GitHub-a
      - name: Okači APK
        uses: actions/upload-artifact@v4
        with:
          name: rezije-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
