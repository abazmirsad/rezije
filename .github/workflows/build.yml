name: Build Android APK

# Kada se pokreće: na svaki push na main granu, i ručno iz GitHub-a.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Napravi Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Preuzmi kod iz repozitorija
      - name: Preuzmi kod
        uses: actions/checkout@v4

      # 2. Instaliraj Javu (potrebna za Android build)
      - name: Postavi Javu
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Instaliraj Flutter (stabilna verzija)
      - name: Postavi Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'
          cache: true

      # 4. Generiši platformske foldere (android/) ako ne postoje.
      #    Ovo pravi potrebnu Android strukturu u oblaku, pa je
      #    ne moramo držati u repozitoriju.
      - name: Generiši Android projekat
        run: flutter create --platforms=android --project-name rezije .

      # 4b. Postavi Android SDK verzije (paketi read_pdf_text/PDFBox i
      #     file_picker traže novije minSdk/compileSdk). Zamjenjujemo
      #     Flutter placeholdere fiksnim vrijednostima u build.gradle.kts.
      - name: Podesi Android SDK verzije
        run: |
          GRADLE=android/app/build.gradle.kts
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' "$GRADLE"
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' "$GRADLE"
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 36/' "$GRADLE"
          echo "----- build.gradle.kts (android blok) -----"
          sed -n '1,60p' "$GRADLE"

      # 5. Preuzmi pakete (dependencies)
      - name: Preuzmi pakete
        run: flutter pub get

      # 6. Provjeri kod (ne prekida build ako ima samo upozorenja)
      - name: Analiziraj kod
        run: flutter analyze || true

      # 7. Napravi release APK
      - name: Napravi APK
        run: flutter build apk --release

      # 8. Okači APK kao artefakt da ga možeš skinuti sa GitHub-a
      - name: Okači APK
        uses: actions/upload-artifact@v4
        with:
          name: rezije-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
