name: rezije
description: "Režije - aplikacija za praćenje režijskih troškova."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Lokalizacija (bosanski datumi, kalendar...)
  flutter_localizations:
    sdk: flutter

  # Ikonice
  cupertino_icons: ^1.0.6

  # State management
  provider: ^6.1.2

  # Lokalna baza podataka (SQLite)
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3

  # Grafovi / grafički prikazi
  fl_chart: ^0.68.0

  # Formatiranje datuma i valute (podrška za lokalizaciju)
  # Verziju bira Flutter da odgovara flutter_localizations paketu.
  intl: any

  # Moderni fontovi
  google_fonts: ^6.2.1

  # Čitanje teksta iz PDF računa (ČISTI DART - ne ruši Android build).
  # Besplatno uz Syncfusion Community licencu (lična/mala upotreba).
  syncfusion_flutter_pdf: ^30.1.42

  # Lokalne notifikacije (podsjetnici na dospijeće) - priprema za kasnije
  # flutter_local_notifications: ^17.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # Ugrađeni PDF uzorci - privremeno, za testiranje čitanja na telefonu.
  # Uklanja se kad Gmail integracija proradi.
  assets:
    - assets/uzorci/
